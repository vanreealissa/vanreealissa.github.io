<style id="app-style">
:root{
  --paper:#F5F1EB; --surface:#FFFCF8; --ink:#252321; --muted:#756F69; --line:#D8D0C7;
  --accent:#A8513F; --accent-fill:#D97862; --accent-ink:#252321; --mark:#E9B6A7; --danger:#A23A2A;
  --cover-a:#EFE8E0; --cover-b:#D8D0C7;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#252321; --surface:#2F2C29; --ink:#F5F1EB; --muted:#B3ABA3; --line:#45403B;
    --accent:#E9B6A7; --accent-fill:#D97862; --accent-ink:#252321; --mark:#A8513F; --danger:#F0A08F;
    --cover-a:#2F2B28; --cover-b:#3A3531;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#252321; --surface:#2F2C29; --ink:#F5F1EB; --muted:#B3ABA3; --line:#45403B;
  --accent:#E9B6A7; --accent-fill:#D97862; --accent-ink:#252321; --mark:#A8513F; --danger:#F0A08F;
  --cover-a:#2F2B28; --cover-b:#3A3531;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;padding-inline:clamp(16px,5vw,56px);padding-block:0 48px}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:22px;border-bottom:1px solid var(--line)}
.monogram{font:800 18px/1 var(--display);letter-spacing:-.01em;text-decoration:none}
.monogram span{color:var(--muted);font-weight:400}
.nav{display:flex;gap:20px;margin-left:auto;margin-right:8px}
.nav a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--ink)}
@media (max-width:720px){.nav{display:none}}
section[id]{scroll-margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent-fill);color:var(--accent-ink);border-color:var(--accent-fill)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--paper);border-color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}

.intro{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px;padding-block:64px 56px;align-items:end}
.intro h1{font:800 clamp(44px,8.5vw,104px)/.92 var(--display);letter-spacing:-.035em;margin:0;text-wrap:balance}
.intro h1 .hl{background:linear-gradient(transparent 70%,var(--mark) 70%, var(--mark) 92%,transparent 92%);padding-inline:.04em}
.avatar{width:128px;height:128px;border-radius:50%;object-fit:cover;object-position:50% 40%;display:block;margin:0 0 22px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.role{font:500 13px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 18px}
.bio{margin:0;max-width:44ch;font-size:17px;color:var(--ink)}
.seeking{display:flex;gap:10px;align-items:baseline;margin:24px 0 0;max-width:44ch;font-weight:500}
.seeking::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent-fill);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-fill) 25%,transparent);transform:translateY(-1px)}
.cta{margin-top:16px;text-decoration:none;padding:9px 18px;font-size:15px}
.facts{display:grid;gap:10px;margin:22px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.facts li{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.facts b{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);width:72px;flex:none}
.facts .val{color:var(--ink);user-select:all;word-break:break-all}
.copy{border:0;background:none;padding:0;color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px}
.links a{color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--line)}
.links a:hover{text-decoration-color:var(--accent)}

.editbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px dashed var(--accent-fill);border-radius:10px;padding:12px 16px;margin-top:20px;font-size:14px}
.editbar p{margin:0;color:var(--muted)}
.editbar .actions{display:flex;gap:8px;flex-wrap:wrap}

.work-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 24px;border-top:2px solid var(--accent-fill);padding-top:14px}
.work-head h2{font:600 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;margin:0}
.work-head h2 span{color:var(--muted);font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font:400 12px/1.5 var(--mono);cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent-ink);border-color:var(--accent-fill)}

.projects{list-style:none;margin:0;padding:0}
.project{display:grid;grid-template-columns:88px minmax(0,1fr) minmax(0,340px);gap:28px;padding-block:32px;border-bottom:1px solid var(--line);align-items:start}
.year{font:500 14px/1.9 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.project h3{font:600 clamp(24px,3.2vw,34px)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.project h3 a{text-decoration:none}
.project h3 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--mark)}
.project .prole{font-size:14px;color:var(--accent);font-weight:500;margin:0 0 12px}
.project .summary{margin:0 0 16px;max-width:60ch;color:var(--ink)}
.highlights{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:6px;max-width:60ch}
.highlights li{display:flex;gap:10px;font-size:15px}
.highlights li::before{content:"";flex:none;width:6px;height:6px;margin-top:.62em;border-radius:50%;background:var(--accent-fill)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{font:400 12px/1.5 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
.visit{display:inline-block;margin-top:16px;font-weight:600;font-size:14px;color:var(--accent);text-underline-offset:4px}
.example{display:inline-block;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--mark);color:#1b1a12;border-radius:3px;padding:4px 6px;margin-bottom:10px}
.cover{aspect-ratio:4/3;max-width:100%;border-radius:8px;overflow:hidden;background:var(--cover-a);border:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.ph{display:grid;place-items:center;background:repeating-linear-gradient(-45deg,var(--cover-a) 0 14px,var(--cover-b) 14px 15px)}
.cover.ph span{font:800 56px/1 var(--display);color:var(--muted);opacity:.55;letter-spacing:-.03em}
.p-edit{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.empty{padding-block:48px;color:var(--muted);text-align:left}

.cv{display:grid;gap:64px;margin-top:72px}
.about{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;padding-top:24px}
.about p{margin:0 0 14px;max-width:62ch}
.about h3{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}
.skills{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0 0 20px}
.skills li{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px}
.skills.soft li{background:transparent;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0}
.timeline>li{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-block:22px;border-bottom:1px solid var(--line)}
.period{font:500 13px/1.8 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.timeline h3{font:600 21px/1.25 var(--display);letter-spacing:-.01em;margin:0}
.org{color:var(--accent);font-weight:500;font-size:14px;margin:3px 0 0}
.timeline ul{margin:10px 0 0;padding-left:1.1em;display:grid;gap:4px}
.timeline .note{font-size:14px;color:var(--muted);margin:6px 0 0}
.timeline.compact>li{padding-block:12px}
.timeline.compact h3{font:500 16px/1.4 var(--body)}
.subhead{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:28px 0 0}
@media (max-width:820px){
  .about{grid-template-columns:1fr;gap:24px}
  .timeline>li{grid-template-columns:1fr;gap:2px}
}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding-top:28px;font:400 12px/1.5 var(--mono);color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,14,12,.5)}
dialog form{display:grid;gap:14px;padding:22px}
dialog h2{font:700 24px/1.1 var(--display);margin:0 0 4px;letter-spacing:-.02em}
.field{display:grid;gap:5px}
.field label{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px;font-size:15px}
.field textarea{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgprev{display:flex;gap:12px;align-items:center}
.imgprev img{width:96px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:6px}
.err{color:var(--danger);font-size:14px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100vw - 32px)}

@media (max-width:820px){
  .intro{grid-template-columns:1fr;gap:24px;padding-block:44px 40px}
  .project{grid-template-columns:1fr;gap:12px}
  .project .cover{order:-1}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .project{animation:rise .5s ease both}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeUrl(u){ u = String(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u = 'https://' + u; try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch(e){ return ''; } }
  function initials(t){ return String(t||'').replace(/^Voorbeeld:\s*/,'').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase();}).join(''); }
  function sorted(){ return STATE.projects.map(function(p,i){return [p,i];}).sort(function(a,b){ var d = (parseInt(b[0].year)||0) - (parseInt(a[0].year)||0); return d || a[1]-b[1]; }).map(function(x){return x[0];}); }
  function allTags(){ var s = {}; STATE.projects.forEach(function(p){ (p.tags||[]).forEach(function(t){ s[t]=1; }); }); return Object.keys(s).sort(function(a,b){return a.localeCompare(b);}); }

  function nameHtml(n){ var parts = esc(n).split(' '); if(parts.length < 2) return '<span class="hl">'+parts[0]+'</span>'; var last = parts.pop(); return parts.join(' ') + ' <span class="hl">' + last + '</span>'; }

  function cvHtml(){
    var C = STATE.cv; if(!C) return '';
    var h = '<div class="cv">';
    if(C.about){
      h += '<section id="over-mij" aria-labelledby="about-h"><div class="work-head"><h2 id="about-h">Over mij</h2></div><div class="about"><div>'
        + C.about.map(function(t){ return '<p>'+esc(t)+'</p>'; }).join('') + '</div><div>';
      if(C.skills) h += '<h3>Vaardigheden</h3><ul class="skills">'+C.skills.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
      if(C.tools) h += '<h3>Werkomgeving</h3><ul class="skills">'+C.tools.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
      if(C.softSkills) h += '<h3>Sterke punten</h3><ul class="skills soft">'+C.softSkills.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
      h += '</div></div></section>';
    }
    function items(list, cls){
      return '<ol class="timeline'+(cls?' '+cls:'')+'">' + list.map(function(x){
        return '<li><div class="period">'+esc(x.period)+'</div><div><h3>'+esc(x.title)+'</h3>'
          + (x.org ? '<p class="org">'+esc(x.org)+'</p>' : '')
          + (x.points && x.points.length ? '<ul>'+x.points.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>' : '')
          + (x.note ? '<p class="note">'+esc(x.note)+'</p>' : '')
          + '</div></li>';
      }).join('') + '</ol>';
    }
    if(C.work){
      h += '<section id="ervaring" aria-labelledby="work-exp-h"><div class="work-head"><h2 id="work-exp-h">Werkervaring</h2></div>' + items(C.work);
      if(C.sideJobs && C.sideJobs.length) h += '<p class="subhead">Bijbanen</p>' + items(C.sideJobs, 'compact');
      h += '</section>';
    }
    if(C.education) h += '<section id="opleiding" aria-labelledby="edu-h"><div class="work-head"><h2 id="edu-h">Opleidingen</h2></div>' + items(C.education) + '</section>';
    return h + '</div>';
  }

  function render(){
    var P = STATE.profile, list = sorted(), tags = allTags();
    if(filter && tags.indexOf(filter) < 0) filter = null;
    var shown = filter ? list.filter(function(p){ return (p.tags||[]).indexOf(filter) >= 0; }) : list;
    var h = '';
    h += '<div class="wrap"><header class="topbar"><a class="monogram" href="#top">'+esc(P.name)+' <span>/ portfolio</span></a>'
      + '<nav class="nav" aria-label="Secties"><a href="#projecten">Projecten</a>' + (STATE.cv ? '<a href="#over-mij">Over mij</a><a href="#ervaring">Ervaring</a><a href="#opleiding">Opleiding</a>' : '') + '</nav>';
    if(canEdit) h += '<button class="btn '+(editing?'':'ghost')+'" id="toggle-edit" type="button">'+(editing?'Klaar met bewerken':'Portfolio bewerken')+'</button>';
    h += '</header>';
    if(canEdit && editing){
      h += '<div class="editbar"><p>Je bent aan het bewerken. Elke keer dat je opslaat, wordt de pagina bijgewerkt voor iedereen met de link.</p><div class="actions"><button class="btn" id="edit-profile" type="button">Profiel bewerken</button><button class="btn primary" id="add-project" type="button">+ Project toevoegen</button></div></div>';
    }
    h += '<section class="intro" id="top"><div>'+(P.photo ? '<img class="avatar" src="'+esc(P.photo)+'" alt="Foto van '+esc(P.name)+'" width="128" height="128">' : '')+'<p class="role">'+esc(P.role)+'</p><h1>'+nameHtml(P.name)+'</h1></div><div><p class="bio">'+esc(P.bio)+'</p><ul class="facts">';
    if(P.location) h += '<li><b>Woont in</b><span class="val" style="user-select:text">'+esc(P.location)+'</span></li>';
    if(P.email) h += '<li><b>E-mail</b><span class="val" id="email-val">'+esc(P.email)+'</span><button class="copy" id="copy-email" type="button">Kopieer</button></li>';
    var links = (P.links||[]).filter(function(l){ return safeUrl(l.url); });
    if(links.length) h += '<li><b>Online</b><span class="links">'+links.map(function(l){ return '<a href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener">'+esc(l.label||l.url)+' ↗</a>'; }).join('')+'</span></li>';
    h += '</ul>'
      + (P.seeking ? '<p class="seeking">'+esc(P.seeking)+'</p>' : '')
      + (P.email ? '<a class="btn primary cta" href="mailto:'+esc(P.email)+'">Neem contact op</a>' : '')
      + '</div></section>';

    h += '<section id="projecten" aria-labelledby="work-h"><div class="work-head"><h2 id="work-h">Recente projecten <span>('+STATE.projects.length+')</span></h2>';
    if(tags.length > 1){
      h += '<div class="filters" role="group" aria-label="Filter op tag"><button class="chip" type="button" data-tag="" aria-pressed="'+(!filter)+'">Alles</button>';
      tags.forEach(function(t){ h += '<button class="chip" type="button" data-tag="'+esc(t)+'" aria-pressed="'+(filter===t)+'">'+esc(t)+'</button>'; });
      h += '</div>';
    }
    h += '</div>';
    if(!shown.length){
      h += '<p class="empty">'+(STATE.projects.length ? 'Geen projecten met deze tag.' : (canEdit ? 'Nog geen projecten. Kies “Portfolio bewerken” en daarna “Project toevoegen”.' : 'Projecten volgen binnenkort.'))+'</p>';
    }
    h += '<ol class="projects">';
    shown.forEach(function(p){
      var url = safeUrl(p.url);
      var title = url ? '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a>' : esc(p.title);
      h += '<li class="project" data-id="'+esc(p.id)+'"><div class="year">'+esc(p.year)+'</div><div>';
      if(p.example) h += '<span class="example">Voorbeeldproject</span>';
      h += '<h3>'+title+'</h3>';
      if(p.role) h += '<p class="prole">'+esc(p.role)+'</p>';
      if(p.summary) h += '<p class="summary">'+esc(p.summary)+'</p>';
      if(p.highlights && p.highlights.length) h += '<ul class="highlights">'+p.highlights.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
      if(p.tags && p.tags.length) h += '<ul class="tags">'+p.tags.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
      if(url) h += '<a class="visit" href="'+esc(url)+'" target="_blank" rel="noopener">'+(/github\.com/i.test(url) ? 'Bekijk de code op GitHub' : 'Bekijk project')+' ↗</a>';
      if(canEdit && editing) h += '<div class="p-edit"><button class="btn" type="button" data-act="edit">Bewerken</button><button class="btn danger" type="button" data-act="del">Verwijderen</button></div>';
      h += '</div>';
      h += p.image ? '<div class="cover"><img src="'+esc(p.image)+'" alt="'+esc(p.title)+'" loading="lazy"></div>' : '<div class="cover ph" aria-hidden="true"><span>'+esc(initials(p.title))+'</span></div>';
      h += '</li>';
    });
    h += '</ol></section>';
    h += cvHtml();
    h += '<footer><span>© '+new Date().getFullYear()+' '+esc(P.name)+'</span><span>Laatst bijgewerkt '+esc(STATE.updated || '2026-09-28')+'</span></footer></div>';
    root.innerHTML = h;
  }

  function toast(msg){ var t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3200); }

  root.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.id === 'toggle-edit'){ editing = !editing; try{ sessionStorage.setItem('pf-editing', editing?'1':'0'); }catch(_){} render(); return; }
    if(b.id === 'add-project'){ openProject(null); return; }
    if(b.id === 'edit-profile'){ openProfile(); return; }
    if(b.id === 'copy-email'){
      var txt = STATE.profile.email;
      var done = function(){ b.textContent = 'Gekopieerd'; setTimeout(function(){ b.textContent='Kopieer'; }, 1600); };
      var fallback = function(){ var r = document.createRange(); r.selectNodeContents(document.getElementById('email-val')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Geselecteerd'; };
      try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(_){ fallback(); }
      return;
    }
    if(b.classList.contains('chip')){ filter = b.dataset.tag || null; render(); return; }
    var li = b.closest('.project'); if(!li) return;
    var p = STATE.projects.find(function(x){ return x.id === li.dataset.id; }); if(!p) return;
    if(b.dataset.act === 'edit') openProject(p);
    if(b.dataset.act === 'del'){
      if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'Klik nogmaals om te verwijderen'; setTimeout(function(){ if(b.isConnected){ b.classList.remove('armed'); b.textContent='Verwijderen'; } }, 4000); return; }
      STATE.projects = STATE.projects.filter(function(x){ return x !== p; });
      save('Project verwijderd');
    }
  });

  /* ---------- dialogs ---------- */
  var dlg = document.createElement('dialog'); dlg.id = 'editor'; document.body.appendChild(dlg);
  var pendingImage = null;

  function field(id, label, value, opts){
    opts = opts || {};
    var input = opts.textarea ? '<textarea id="'+id+'" name="'+id+'"'+(opts.req?' required':'')+'>'+esc(value)+'</textarea>'
      : '<input id="'+id+'" name="'+id+'" type="'+(opts.type||'text')+'" value="'+esc(value)+'"'+(opts.req?' required':'')+(opts.ph?' placeholder="'+esc(opts.ph)+'"':'')+(opts.extra||'')+'>';
    return '<div class="field"><label for="'+id+'">'+label+'</label>'+input+(opts.hint?'<span class="hint">'+opts.hint+'</span>':'')+'</div>';
  }

  function openProject(p){
    pendingImage = p ? p.image : '';
    var d = p || {title:'',year:String(new Date().getFullYear()),role:'',summary:'',tags:[],url:''};
    dlg.innerHTML = '<form method="dialog" id="pf-form"><h2>'+(p?'Project bewerken':'Project toevoegen')+'</h2>'
      + field('f-title','Projectnaam', d.title, {req:true, ph:'bijv. Reserveringssysteem voor een restaurant'})
      + '<div class="row2">' + field('f-year','Jaar', d.year, {req:true, ph:'2026', extra:' inputmode="numeric"'}) + field('f-role','Jouw rol', d.role, {ph:'bijv. Full-stack developer'}) + '</div>'
      + field('f-summary','Omschrijving', d.summary, {textarea:true, hint:'Twee of drie zinnen: het probleem, wat je hebt gebouwd en het resultaat.'})
      + field('f-hl','Wat heb je gebouwd?', (d.highlights||[]).join('\n'), {textarea:true, hint:'Eén punt per regel, bijvoorbeeld: JSON-API met rate limiting. Twee of drie punten is genoeg.'})
      + field('f-tags','Tags', (d.tags||[]).join(', '), {ph:'Laravel, PHP, React', hint:'Scheid met komma’s. Bezoekers kunnen hierop filteren.'})
      + field('f-url','Link', d.url, {ph:'https://…', hint:'Live website, GitHub-repo, case study of video. Optioneel.'})
      + '<div class="field"><label for="f-image">Afbeelding</label><div class="imgprev"><img id="f-prev" alt="" '+(pendingImage?'src="'+esc(pendingImage)+'"':'hidden')+'><input id="f-image" name="f-image" type="file" accept="image/*"></div><button class="copy" type="button" id="f-noimg" '+(pendingImage?'':'hidden')+'>Afbeelding verwijderen</button></div>'
      + '<p class="err" id="f-err" hidden></p>'
      + '<div class="dlg-actions"><button class="btn ghost" type="button" id="f-cancel">Annuleren</button><button class="btn primary" type="submit" id="f-save">'+(p?'Wijzigingen opslaan':'Project toevoegen')+'</button></div></form>';
    dlg.showModal();
    var form = dlg.querySelector('form');
    dlg.querySelector('#f-cancel').onclick = function(){ dlg.close(); };
    dlg.querySelector('#f-noimg').onclick = function(){ pendingImage=''; var i = dlg.querySelector('#f-prev'); i.hidden = true; i.removeAttribute('src'); this.hidden = true; dlg.querySelector('#f-image').value=''; };
    dlg.querySelector('#f-image').onchange = function(){
      var f = this.files && this.files[0]; if(!f) return;
      shrink(f).then(function(url){ pendingImage = url; var i = dlg.querySelector('#f-prev'); i.src = url; i.hidden = false; dlg.querySelector('#f-noimg').hidden = false; })
        .catch(function(){ showErr('Deze afbeelding kan niet worden gelezen. Probeer een JPG of PNG.'); });
    };
    form.onsubmit = function(e){
      e.preventDefault();
      var v = function(id){ return dlg.querySelector('#'+id).value.trim(); };
      var urlIn = v('f-url');
      if(urlIn && !safeUrl(urlIn)) return showErr('De link lijkt geen webadres. Probeer iets als https://voorbeeld.nl.');
      var data = { title:v('f-title'), year:v('f-year'), role:v('f-role'), summary:v('f-summary'),
        highlights:v('f-hl').split('\n').map(function(t){return t.trim();}).filter(Boolean), tags:v('f-tags').split(',').map(function(t){return t.trim();}).filter(Boolean), url: urlIn ? safeUrl(urlIn) : '', image: pendingImage || '' };
      if(p){ Object.assign(p, data); delete p.example; }
      else { data.id = 'p' + Date.now().toString(36); STATE.projects.push(data); }
      save(p ? 'Project bijgewerkt' : 'Project toegevoegd');
    };
  }

  function openProfile(){
    var P = STATE.profile;
    var linksTxt = (P.links||[]).map(function(l){ return (l.label ? l.label + ' | ' : '') + l.url; }).join('\n');
    dlg.innerHTML = '<form method="dialog"><h2>Profiel bewerken</h2>'
      + field('g-name','Naam', P.name, {req:true})
      + field('g-role','Wat je doet', P.role, {ph:'bijv. Laravel developer'})
      + field('g-bio','Korte bio', P.bio, {textarea:true})
      + field('g-seeking','Waar ben je naar op zoek?', P.seeking||'', {ph:'bijv. Ik zoek een baan als junior developer in de regio Rotterdam.', hint:'Optioneel. Staat onder je bio, met een knop om contact op te nemen.'})
      + '<div class="row2">' + field('g-loc','Woont in', P.location) + field('g-email','E-mailadres', P.email, {type:'email', ph:'jij@voorbeeld.nl'}) + '</div>'
      + field('g-links','Links', linksTxt, {textarea:true, hint:'Eén per regel, als “Label | https://…”. Bijvoorbeeld: GitHub | https://github.com/jouwnaam'})
      + '<p class="err" id="f-err" hidden></p>'
      + '<div class="dlg-actions"><button class="btn ghost" type="button" id="f-cancel">Annuleren</button><button class="btn primary" type="submit" id="f-save">Profiel opslaan</button></div></form>';
    dlg.showModal();
    dlg.querySelector('#f-cancel').onclick = function(){ dlg.close(); };
    dlg.querySelector('form').onsubmit = function(e){
      e.preventDefault();
      var v = function(id){ return dlg.querySelector('#'+id).value.trim(); };
      var links = v('g-links').split('\n').map(function(line){ line = line.trim(); if(!line) return null; var parts = line.split('|'); var url = parts.pop().trim(); var label = parts.join('|').trim(); return { label: label || url.replace(/^https?:\/\//,''), url: url }; }).filter(Boolean);
      var bad = links.find(function(l){ return !safeUrl(l.url); });
      if(bad) return showErr('Deze link is geen webadres: ' + bad.url);
      STATE.profile = { photo:P.photo||'', name:v('g-name'), role:v('g-role'), bio:v('g-bio'), seeking:v('g-seeking'), location:v('g-loc'), email:v('g-email'), links: links.map(function(l){ return {label:l.label, url:safeUrl(l.url)}; }) };
      save('Profiel opgeslagen');
    };
  }

  function showErr(msg){ var el = dlg.querySelector('#f-err'); if(el){ el.textContent = msg; el.hidden = false; } }

  function shrink(file){
    return new Promise(function(res, rej){
      var r = new FileReader();
      r.onerror = rej;
      r.onload = function(){
        var img = new Image();
        img.onerror = rej;
        img.onload = function(){
          var max = 1400, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
          var c = document.createElement('canvas'); c.width = Math.round(w*k); c.height = Math.round(h*k);
          var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  /* ---------- saving: the page republishes itself ---------- */
  function buildDocument(){
    var json = JSON.stringify(STATE).replace(/</g,'\\u003c');
    return '<!doctype html>\n<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
      + '<title>' + esc(STATE.profile.name || 'Portfolio') + '</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + document.getElementById('app-fonts').outerHTML
      + '<style id="app-style">' + document.getElementById('app-style').textContent + '</style></head><body>'
      + '<div id="root"></div>'
      + '<script type="application/json" id="app-state">' + json + '<\/script>'
      + '<script id="app-script">' + document.getElementById('app-script').textContent + '<\/script>'
      + '</body></html>';
  }

  function save(msg){
    if(busy) return;
    if(!artifactApi){ showErr('Opslaan is in deze weergave niet beschikbaar.'); return; }
    busy = true;
    STATE.updated = new Date().toISOString().slice(0,10);
    var btn = dlg.querySelector('#f-save'); if(btn){ btn.disabled = true; btn.textContent = 'Bezig met publiceren…'; }
    try { sessionStorage.setItem('pf-editing','1'); sessionStorage.setItem('pf-toast', msg); } catch(_){}
    artifactApi.publish(buildDocument()).then(function(){ /* de pagina herlaadt naar de nieuwe versie */ })
      .catch(function(err){
        busy = false;
        var code = err && err.code;
        if(code === 'conflict'){ return; }
        var text = code === 'not_writer' || code === 'not_granted' ? 'Je hebt geen toestemming om dit portfolio te wijzigen.' : 'Je wijziging kon niet worden gepubliceerd. Controleer je verbinding en probeer het opnieuw.';
        if(dlg.open){ showErr(text); if(btn){ btn.disabled = false; btn.textContent = 'Opnieuw proberen'; } } else { toast(text); render(); }
      });
    if(!dlg.open) toast('Bezig met publiceren…');
  }

  render();
  try { var t = sessionStorage.getItem('pf-toast'); if(t){ sessionStorage.removeItem('pf-toast'); toast(t); } } catch(_){}

})();
</script>
</body>
</html>
